# Configuração do PixZap (segredos ficam no .env, nunca aqui)

# Números de WhatsApp autorizados a dar comandos ao bot
# (formato E.164 sem '+', ex.: 5511999998888)
seller_numbers: []

timezone: America/Sao_Paulo
language: pt            # idioma das respostas do bot: pt | en | es | id
currency: BRL           # moeda exibida: BRL | MXN | ARS | COP | NGN | KES | INR | IDR | USD
public_url: ""          # URL pública https (habilita o comando "painel")
port: 8000

# Limite diário do comando "transferir" (na moeda; ex.: 2000 = R$ 2.000,00).
# 0 = transferências pelo chat DESATIVADAS (padrão seguro).
transfer_daily_limit: 0

whatsapp:
  provider: fake        # fake (dev) | cloud (WhatsApp Business Cloud API oficial)
  phone_number_id: ""   # ID do número no painel da Meta (provider: cloud)

psp:
  provider: fake        # fake (dev) | asaas | mercadopago
  asaas_sandbox: true
  asaas_pix_key: ""     # chave Pix cadastrada no Asaas (QR estático)
  mp_payer_email: ""    # e-mail placeholder exigido pela API Pix do Mercado Pago
